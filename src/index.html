<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive website that adapts to any screen size."
    />
    <meta name="author" content="Chalmer Gambler" />
    <meta
      name="keywords"
      content="responsive web application, Spots, photo sharing"
    />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/Spots-logo.svg')%>"
          alt="Spots logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button type="button" class="profile__avatar-button">
              <img
                src="<%=require('./images/pencil-light.svg')%>"
                alt="pencil icon"
                class="profile__pencil-icon"
              />
            </button>
            <img src="#" alt="Profile avatar" class="profile__avatar" />
          </div>
          <div class="profile__text">
            <h1 class="profile__title"></h1>
            <p class="profile__subtitle"></p>
            <button type="button" class="profile__edit-button">
              <img
                class="profile__edit-button-icon"
                src="<%=require('./images/pencil.svg')%>"
                alt="pencil logo"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__post-button">
            <img
              class="profile__post-button-icon"
              src="<%=require('./images/cross.svg')%>"
              alt="cross logo"
            />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button
                  type="button"
                  class="card__delete-button"
                  aria-label="Delete card"
                ></button>
                <img src="#" alt="Card Image" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button
                    type="button"
                    class="card__like-button"
                    aria-label="Like card"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__text">2026 © Chalmer Gambler</p>
      </footer>

      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <div class="modal__row">
            <h2 class="modal__title">Edit profile</h2>
            <button
              type="button"
              class="modal__close-button"
              aria-label="Close modal"
            ></button>
          </div>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
                required
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <div class="modal__row">
            <h2 class="modal__title">New post</h2>
            <button
              type="button"
              class="modal__close-button"
              aria-label="Close modal"
            ></button>
          </div>
          <form class="modal__form" novalidate>
            <label for="card-image-input" class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="card-image-input-error" class="modal__error"></span>
            </label>
            <label for="card-caption-input" class="modal__label">
              Caption
              <input
                id="card-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span id="card-caption-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>

      <div class="modal modal_type_preview" id="image-modal">
        <div class="modal__image-container">
          <button
            type="button"
            class="modal__close-button modal__close-button_type_preview"
            aria-label="Close modal"
          ></button>
          <img src="#" alt="" class="modal__image" />
          <p class="modal__image-title"></p>
        </div>
      </div>

      <div class="modal" id="edit-avatar-modal">
        <div class="modal__container">
          <div class="modal__row">
            <h2 class="modal__title">Edit profile avatar</h2>
            <button
              type="button"
              class="modal__close-button"
              aria-label="Close modal"
            ></button>
          </div>
          <form class="modal__form" novalidate>
            <label for="profile-avatar-input" class="modal__label">
              Profile Picture
              <input
                id="profile-avatar-input"
                type="url"
                class="modal__input"
                name="avatar"
                placeholder="Paste the link to an image"
                required
              />
              <span id="profile-avatar-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>

      <div class="modal modal_type_delete" id="delete-modal">
        <div class="modal__container modal__container_type_delete">
          <div class="modal__row">
            <h2 class="modal__title modal__title_type_delete">
              Are you sure you want to delete this image?
            </h2>

            <button
              type="button"
              class="modal__close-button modal__close-button_type_delete"
              aria-label="Close modal"
            ></button>
          </div>
          <form class="modal__form modal__form_type_delete" novalidate>
            <button
              type="submit"
              class="modal__submit-button modal__submit-button_type_delete"
            >
              Delete
            </button>
            <button type="button" class="modal__cancel-button">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
