<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="An interactive website that adapts to any screen size."/><meta name="author" content="Chalmer Gambler"/><meta name="keywords" content="responsive website, Bessie Coleman"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="b95c2e6ac9c136885789.svg" alt="Spots logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><img src="04c411e519a1c6561568.jpg" alt="Bessie Coleman" class="profile__avatar"/><div class="profile__text"><h1 class="profile__title">Bessie Coleman</h1><p class="profile__subtitle">Civil Aviator</p><button type="button" class="profile__edit-button"><img class="profile__edit-button-icon" src="65d8affc5335655b643b.svg" alt="pencil logo"/> Edit Profile</button></div><button type="button" class="profile__post-button"><img class="profile__post-button-icon" src="40608da7369d39bc1077.svg" alt="cross logo"/> New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button type="button" class="card__delete-button"></button> <img src="#" alt="" class="card__image"/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer page__section"><p class="footer__text">2026 © Chalmer Gambler</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><div class="modal__row"><h2 class="modal__title">Edit profile</h2><button type="button" class="modal__close-button"></button></div><form class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input"
